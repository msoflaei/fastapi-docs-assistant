[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "sentence-transformers",
    "psycopg[binary]",
    "pgvector",
    "anthropic",
    "python-dotenv",
    "fastapi[standard]",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest"]
frameworks = [
    "llama-index-core",
    "llama-index-embeddings-huggingface",
    "llama-index-vector-stores-postgres",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs the local database and embedding model (run with: pytest -m integration)",
]